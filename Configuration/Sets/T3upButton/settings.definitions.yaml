categories:
  t3upButton:
    label: 'T3up Button'

settings:
  t3upButton.symbolwidth:
    label: 'Symbol width'
    category: t3upButton
    type: string
    default: 'inherit'
  t3upButton.symbolsize:
    label: 'Symbol size'  
    category: t3upButton
    default: 'very large'
    type: string
    enum:
      0: 'none'
      12rem: 'extrem large'
      10rem: 'very large'
      8rem: 'large'
      6rem: 'larger'
      4rem: 'medium'
      2rem: 'small'
      1rem: 'very small'
  t3upButton.symboltextsize:
    label: 'Symbolbutton text size'  
    category: t3upButton
    default: 'very large'
    type: string
    enum:
      0: 'none'
      5rem: 'extrem large'
      4rem: 'very large'
      3rem: 'large'
      2.5rem: 'larger'
      2rem: 'medium'
      1.5rem: 'small'
      1rem: 'very small'
  t3upButton.symboltextweight:
    label: 'Symbolbutton text font-weight'  
    category: t3upButton
    default: 'bold'
    type: string
    enum:
      bold: 'bold'
      normal: 'normal'
  t3upButton.imagesize:
    label: 'Imagebutton text size'  
    category: t3upButton
    default: 'very large'
    type: string
    enum:
      0: 'none'
      5rem: 'extrem large'
      4rem: 'very large'
      3rem: 'large'
      2.5rem: 'larger'
      2rem: 'medium'
      1.5rem: 'small'
      1rem: 'very small'
  t3upButton.imagewidth:
    label: 'Image width'
    category: t3upButton
    type: string
    default: 'inherit'
  t3upButton.imageweight:
    label: 'Imagebutton font-weight'  
    category: t3upButton
    default: 'bold'
    type: string
    enum:
      bold: 'bold'
      normal: 'normal'
  t3upButton.textwidth:
    label: 'Textbutton width'
    category: t3upButton
    type: string
    default: 'inherit'
    
    
    
    
    
    
    
    
    
    
    