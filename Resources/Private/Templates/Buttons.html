<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
    <f:layout name="Default"/>
    <f:section name="Main">
        <div class="containerbuttons d-flex w-100 align-items-stretch Item{f:count(subject: childrenContent)} {flexFormData.align} {f:if(condition: flexFormData.border, then: 'childBorder{flexFormData.border}')}     {f:if(condition: flexFormData.spacing, then: 'spacing{flexFormData.spacing}')} {f:if(condition: flexFormData.format, then: '{flexFormData.format}')} {f:if(condition:'{flexFormData.round} = true', then: 'round{flexFormData.round}')} {flexFormData.bordercolor}Bd    ">    
            <f:for each="{childrenContent}" as="child" iteration="iterator">
                <f:format.raw>{child.renderedContent}</f:format.raw>
            </f:for>
        </div>    
    </f:section>        
</html>
