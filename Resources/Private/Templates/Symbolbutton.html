<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

    <div id="c{data.uid}" class="frame-{data.CType} d-flex flex-column  align-items-center justify-content-center {flexFormData.symbolcolor} {flexFormData.bgcolor}Bg {flexFormData.padding}">
	    <span class="order-2 symbol d-block text-center symbolsize">
            <f:link.typolink parameter="{data.header_link}">
                <f:format.nl2br>{data.bodytext}</f:format.nl2br>
            </f:link.typolink>
         </span>   
         <f:if condition="{flexFormData.textposition}">
	           <f:format.nl2br><p class="order-{flexFormData.textposition} d-block; text-align-center m-0 px-3 symboltextsize"><b>{data.header}</b><br></p></f:format.nl2br>
         </f:if>         
    </div>
</html>
