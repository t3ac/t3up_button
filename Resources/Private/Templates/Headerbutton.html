<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

	<f:variable name="hs" value="h{flexFormData.headersize}" />
 
    <div id="c{data.uid}" class="frame-{data.CType} d-flex flex-column p-3 justify-content-{flexFormData.valign} text-{flexFormData.textalign}  {flexFormData.color} {flexFormData.bgcolor}Bg">
        <f:link.typolink parameter="{data.header_link}">
          	<span class="d-block {hs} m-0 "><f:format.nl2br>{data.header}</f:format.nl2br></span>
          	<f:if condition="{data.bodytext}">
          	    <span class="pt-3 m-0"><f:format.nl2br><f:format.crop maxCharacters="100">{data.bodytext}</f:format.crop></f:format.nl2br></span>
          	</f:if>
        </f:link.typolink>
    </div>
</html>
